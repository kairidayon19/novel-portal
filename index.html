<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="おすすめライトノベルの作品一覧。作品名・著者・イラスト・レーベルで検索できます。"><title>ライトノベル作品ポータル</title><link rel="stylesheet" href="style.css"></head>
<body><header class="hero"><div class="wrap"><div class="eyebrow">LIGHT NOVEL LIBRARY</div><h1>📚 ライトノベル作品ポータル</h1><p>おすすめの一冊を探そう。</p></div></header>
<main class="wrap"><section class="panel filters" aria-label="作品を探す"><h2>作品を検索</h2><div class="search-row"><label class="sr-only" for="search">検索キーワード</label><input id="search" type="search" placeholder="キーワードを入力（部分一致）" autocomplete="off"><button id="clear" type="button" class="clear">条件クリア</button></div><fieldset><legend>検索対象</legend><div class="radios"><label><input type="radio" name="field" value="all" checked>すべて</label><label><input type="radio" name="field" value="title">作品名</label><label><input type="radio" name="field" value="author">著者</label><label><input type="radio" name="field" value="illustrator">イラスト</label><label><input type="radio" name="field" value="label">レーベル</label></div></fieldset><div class="section-head"><h2>絞り込み</h2></div><div class="filter-grid"><label>発売年月<select id="date"><option value="">すべて</option></select></label><label>刊行状況<select id="status"><option value="">すべて</option><option value="完結">完結</option><option value="継続">継続</option><option value="打ち切り">打ち切り</option><option value="その他">その他・未設定</option></select></label></div></section>
<section class="results" aria-label="検索結果"><div class="results-bar"><div><h2>検索結果 <span id="count">—</span><span class="unit">作品</span></h2><p id="hint">データを読み込み中…</p></div><label class="sort">並び替え<select id="sort"><option value="title">作品名順</option><option value="date-desc">発売年月（新しい順）</option><option value="date-asc">発売年月（古い順）</option><option value="author">著者名順</option><option value="label">レーベル順</option></select></label></div><div id="cards" class="cards" aria-live="polite"></div><div id="empty" class="empty" hidden>該当する作品がありません。条件を変更してお試しください。</div><div class="more-row"><button id="more" type="button" hidden>さらに表示する</button></div></section></main><footer>作品データは管理者が登録しています。購入先は外部サイトに移動します。</footer><script src="app.js" defer></script></body></html>
